name: Feature request
description: Suggest a new resource, a new team or an improvement to the tooling.
title: "feat: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What is this about?
      options:
        - New skill, agent, command, hook or MCP server
        - New multi-agent team
        - Validation or plugin tooling
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what is missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should be added or changed? Link the upstream project or source if there is one.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
